logging:
  level:
    com.cortis: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN

  file:
    name: logs/cortis.log

management:
  endpoints:
    web:
      exposure:
        include: health,info
# Production must be served only via HTTPS, with trusted proxy headers configured.
server:
  servlet:
    session:
      cookie:
        secure: true
security:
  session:
    secure-csrf-cookie: true
