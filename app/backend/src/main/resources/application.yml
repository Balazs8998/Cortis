server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        name: CORTIS_SESSION
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: cortis-backend

  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    open-in-view: false
    show-sql: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

    schemas:
      - core
      - specification
      - company
      - map
      - archive
      - personal
      - translation
      - agent

    default-schema: core

    baseline-on-migrate: false
    baseline-version: 1

    validate-on-migrate: true
    clean-disabled: true

management:
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,info
security:
  session:
    secure-csrf-cookie: ${CSRF_COOKIE_SECURE:false}
  chip:
    hmac-secret-key: ${CHIP_HMAC_SECRET}

  rate-limit:
    agent-limit:
      max-requests: 30
      window-seconds: 60
    agent-global-limit:
      max-requests: 250
      window-seconds: 60
    enabled: true
    default-limit:
      max-requests: 120
      window-seconds: 60
    login-limit:
      max-requests: 5
      window-seconds: 60
    strict-limit:
      max-requests: 20
      window-seconds: 60

logging:
  file:
    name: logs/cortis.log

  level:
    com.cortis: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [traceId=%X{traceId:-} spanId=%X{spanId:-}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [traceId=%X{traceId:-} spanId=%X{spanId:-}] %logger{36} - %msg%n"