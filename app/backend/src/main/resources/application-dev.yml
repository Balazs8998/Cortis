security:
  rate-limit:
    login-limit:
      max-requests: 20
      window-seconds: 60

logging:
  level:
    com.cortis: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

  file:
    name: logs/cortis-dev.log

management:
  endpoints:
    web:
      exposure:
        include: health,info